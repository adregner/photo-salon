# Runs tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake, uv
        run: brew install cmake uv

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/qt-mac
          key: qt-mac-6.11.1-${{ runner.arch }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip3 install --user --quiet aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          aqt install-qt --outputdir ~/qt-mac mac desktop 6.11.1 macos --archives icu qtbase

      - name: Add Qt to PATH
        run: echo "$HOME/qt-mac/6.11.1/macos/bin" >> $GITHUB_PATH

      - name: Build
        run: ./build

      - name: Test
        run: cd _build && ctest --output-on-failure

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: /opt/qt-linux
          key: qt-linux-6.11.1-gcc_64

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libgl1-mesa-dev

      - name: Build
        run: ./build

      - name: Test
        run: cd _build && ctest --output-on-failure
