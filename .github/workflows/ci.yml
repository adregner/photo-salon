# Runs tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew Qt bottles
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-qt-${{ runner.arch }}-6.x

      - name: Install Qt and CMake
        run: brew install qt cmake

      - name: Build
        run: ./build

      - name: Test
        run: cd _build && ctest --output-on-failure

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: /opt/qt-linux
          key: qt-linux-6.11.1-gcc_64

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libgl1-mesa-dev

      - name: Build
        run: ./build

      - name: Test
        run: cd _build && ctest --output-on-failure
