# Builds, signs, notarizes, and uploads the macOS DMG whenever a GitHub release is created.
# Tests run before the bundle step — the job aborts if any test fails.
# Signing and notarization are opt-in: skipped when MACOS_CERTIFICATE is absent.
#
# ── Secrets (Settings → Secrets and variables → Actions → Secrets) ───────────
#   MACOS_CERTIFICATE          — base64-encoded Developer ID Application .p12
#                                export: base64 -i cert.p12 | pbcopy
#   MACOS_CERTIFICATE_PASSWORD — password used when exporting the .p12
#   MACOS_CODESIGN_IDENTITY    — full identity string from `security find-identity`:
#                                "Developer ID Application: Your Name (TEAMID)"
#   MACOS_NOTARIZE_APPLE_ID    — Apple ID email address
#   MACOS_NOTARIZE_PASSWORD    — app-specific password (appleid.apple.com → Security)
#   MACOS_NOTARIZE_TEAM_ID     — 10-character team ID (developer.apple.com → Membership)

name: macOS

on:
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest
    environment: builder
    permissions:
      contents: write
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      # Release binaries must ship the HEIC / JPEG 2000 plugins: a missing codec
      # fails the CMake configure instead of silently dropping the format.
      PHOTO_SALON_REQUIRE_CODECS: 1

    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/qt-mac
          key: qt-mac-6.11.1-${{ runner.arch }}

      - name: Install cmake and image codecs
        run: brew install cmake libheif openjpeg

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --quiet aqtinstall
          ARCH=$("$RUNNER_TEMP/aqt-venv/bin/aqt" list-qt mac desktop --arch 6.11.1 | awk '{print $1}')
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt --outputdir ~/qt-mac mac desktop 6.11.1 "$ARCH" --archives icu qtbase

      - name: Add Qt to PATH
        run: echo "$(echo $HOME/qt-mac/6.11.1/*/bin)" >> $GITHUB_PATH

      - name: Build
        run: ./build

      - name: Test
        run: cd _build && ctest --output-on-failure

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Bundle, sign, and notarize
        env:
          CODESIGN_IDENTITY:  ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARIZE_APPLE_ID:  ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD:  ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          NOTARIZE_TEAM_ID:   ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: ./bundle-macos.sh --dmg

      - name: Delete signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH"

      - name: Upload DMG to release
        run: gh release upload "${{ github.ref_name }}" _bundle/photo-salon.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
